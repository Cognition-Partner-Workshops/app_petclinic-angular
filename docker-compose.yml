version: "3.8"

services:
  # ──────────────────────────────────────────────
  # Reverse Proxy – Traefik
  # ──────────────────────────────────────────────
  reverse-proxy:
    image: traefik:v2.11
    container_name: petclinic-reverse-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "8081:8080"   # Traefik dashboard
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - petclinic-network
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ──────────────────────────────────────────────
  # Backend – Spring PetClinic REST API
  # ──────────────────────────────────────────────
  api-server:
    image: springcommunity/spring-petclinic-rest:latest
    container_name: petclinic-api-server
    restart: unless-stopped
    environment:
      - SERVER_PORT=9966
      - SPRING_PROFILES_ACTIVE=hsqldb,spring-data-jpa
    expose:
      - "9966"
    networks:
      - petclinic-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api.rule=PathPrefix(`/petclinic/api`)"
      - "traefik.http.routers.api.entrypoints=web"
      - "traefik.http.routers.api.priority=20"
      - "traefik.http.services.api.loadbalancer.server.port=9966"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9966/petclinic/api/vets || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5
    depends_on:
      reverse-proxy:
        condition: service_healthy

  # ──────────────────────────────────────────────
  # Frontend – Angular (served by nginx)
  # ──────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    image: petclinic-frontend:latest
    container_name: petclinic-frontend
    restart: unless-stopped
    expose:
      - "8080"
    networks:
      - petclinic-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.routers.frontend.priority=10"
      - "traefik.http.services.frontend.loadbalancer.server.port=8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    depends_on:
      api-server:
        condition: service_healthy

networks:
  petclinic-network:
    driver: bridge
    name: petclinic-network
